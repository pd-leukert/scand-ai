name: scand-ai

services:
  # Local inference for both the extraction job and the answering path. No external model
  # API ever sees the archive — see CLAUDE.md and D8. Reached as http://ollama:11434 on
  # the compose network; also published on loopback so `ollama` and `curl` work on the VM.
  #
  # Defaults are the laptop: CPU, a small model, a throwaway volume. The VM becomes itself
  # by setting OLLAMA_RUNTIME, OLLAMA_DATA_DIR and LLM_MODEL. See D25 and the README.
  ollama:
    image: ollama/ollama
    # `runc` is the stock runtime and ignores GPUs. The VM sets OLLAMA_RUNTIME=nvidia,
    # which is the one GPU knob that an environment variable can actually turn: a
    # `deploy.resources.reservations.devices` block cannot be switched off by
    # interpolation, so it is not used here. See D25.
    runtime: ${OLLAMA_RUNTIME:-runc}
    volumes:
      # No slash: a named volume, created empty, fine for a laptop. The VM sets
      # OLLAMA_DATA_DIR=/root/ollama-data, an absolute path, which compose reads as a bind
      # instead — so the weights already downloaded there are reused, never re-fetched.
      - ${OLLAMA_DATA_DIR:-ollama-models}:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Verified to be harmless on CPU — llama.cpp enables both and serves normally — so
      # these are not part of the switch.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=30m
      # The context every model is served with unless a request asks for its own. The
      # OpenAI-compatible endpoint the backend uses cannot ask — `options.num_ctx` is ignored
      # there — so this is the only thing standing between the answering path and a silently
      # truncated record. Ollama's own default is 4096, which does not hold the record. Keep it
      # equal to the backend's LLM_NUM_CTX below. See D34.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      # Only read when runtime is nvidia; inert under runc.
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      # `ollama list` goes through the HTTP API, so this is a real readiness check.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # A job: pulls the weights into the server's volume and exits. Nothing that calls a
  # model starts until it has, so a first query can never 404 on a missing model. Pulling
  # a model that is already there is a no-op, so this costs seconds on every later
  # `compose up`.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - ANSWERING_MODEL=${LLM_MODEL:-qwen3:0.6b}
      - EXTRACTION_MODEL=${EXTRACTION_LLM_MODEL:-${LLM_MODEL:-qwen3:0.6b}}
      - RECONCILE_MODEL=${RECONCILE_LLM_MODEL:-${EXTRACTION_LLM_MODEL:-${LLM_MODEL:-qwen3:0.6b}}}
      # Reported, not used: the switch's three variables are independent, so a half-set
      # VM runs happily in the wrong shape. Printing the resolved values puts that in the
      # deploy log instead of leaving it to be discovered later. See D26.
      - RESOLVED_RUNTIME=${OLLAMA_RUNTIME:-runc}
      - RESOLVED_STORE=${OLLAMA_DATA_DIR:-ollama-models (fresh named volume)}
      - RESOLVED_CONTEXT=${OLLAMA_CONTEXT_LENGTH:-16384}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "=============================================================="
        echo " ollama-pull: resolved configuration"
        echo "   runtime   : $$RESOLVED_RUNTIME   (nvidia = GPU, runc = CPU)"
        echo "   model store: $$RESOLVED_STORE"
        echo "   answering : $$ANSWERING_MODEL"
        echo "   extraction: $$EXTRACTION_MODEL"
        echo "   reconcile : $$RECONCILE_MODEL"
        echo "   context   : $$RESOLVED_CONTEXT tokens"
        echo "=============================================================="
        case "$$RESOLVED_RUNTIME:$$RESOLVED_STORE" in
          nvidia:ollama-models*)
            echo "WARNING: GPU runtime but no OLLAMA_DATA_DIR — this will download the"
            echo "WARNING: model from scratch instead of reusing the weights on disk." ;;
        esac
        case "$$RESOLVED_RUNTIME:$$ANSWERING_MODEL" in
          runc:*27b*|runc:*70b*|runc:*qwen3.8*)
            echo "WARNING: large model on the CPU runtime — set OLLAMA_RUNTIME=nvidia, or"
            echo "WARNING: this will be far too slow to demo." ;;
        esac
        # The whole reconciled record goes into one prompt (D2). The full 45-document corpus is
        # well over 100k tokens, so the default context holds a few documents and no more — and
        # the backend now refuses a question rather than answer from a truncated record (D34).
        # A GPU box is the full-corpus shape, so say so there.
        case "$$RESOLVED_RUNTIME:$$RESOLVED_CONTEXT" in
          nvidia:16384)
            echo "WARNING: OLLAMA_CONTEXT_LENGTH is still the 16384 default on a GPU box. The"
            echo "WARNING: full corpus does not fit in that, and the backend will answer 413"
            echo "WARNING: rather than answer from a record the model only partly saw. Set"
            echo "WARNING: OLLAMA_CONTEXT_LENGTH to what this model can serve." ;;
        esac
        # Pulled here or it 404s in the middle of the longest job in the stack (D31).
        ollama pull "$$ANSWERING_MODEL" && ollama pull "$$EXTRACTION_MODEL" && ollama pull "$$RECONCILE_MODEL"
    restart: "no"

  # A job, not a service: it runs once, writes the statements file and then the reconciled
  # file, and exits 0. Nothing else starts until it has, and a failure in either pass is a
  # failed job. See docs/decisions.md D12 and D31.
  statement-extraction:
    build:
      context: .
      dockerfile: statement_extraction/Dockerfile
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      - statements:/data
    environment:
      # Extraction's model is configured separately from the answering model on purpose —
      # they are allowed to differ (CLAUDE.md, "the model is a configuration value").
      - EXTRACTION_LLM_BASE_URL=http://ollama:11434/v1
      - EXTRACTION_LLM_MODEL=${EXTRACTION_LLM_MODEL:-${LLM_MODEL:-qwen3:0.6b}}
      # Reconciliation is a reasoning pass over short contexts, not a copying task, so it can
      # want a different model from extraction. It defaults to the extraction model, which
      # defaults to the answering one (D31).
      - RECONCILE_LLM_MODEL=${RECONCILE_LLM_MODEL:-${EXTRACTION_LLM_MODEL:-${LLM_MODEL:-qwen3:0.6b}}}
      # The reconciliation gates, passed through so they can be moved from Coolify without a
      # code change. Each one fails the job rather than writing a record it does not believe,
      # and a failed job holds the backend and frontend down with it — so on a first run over a
      # corpus these have never seen, set them to 1 to watch the numbers, then tighten. The
      # defaults are guesses; see D31 and D33 for what each is guarding against.
      - RECONCILE_MAX_UNTAGGED=${RECONCILE_MAX_UNTAGGED:-0.1}
      - RECONCILE_MAX_TOPICS=${RECONCILE_MAX_TOPICS:-0.35}
      - RECONCILE_MAX_TOPIC_SHARE=${RECONCILE_MAX_TOPIC_SHARE:-0.5}
      - RECONCILE_MAX_FLAGGED=${RECONCILE_MAX_FLAGGED:-0.5}
    # Never restart a job that has finished.
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      statement-extraction:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      # Read-only: extraction is the only writer of the derived artifacts.
      - statements:/data:ro
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-qwen3:0.6b}
      # What the ollama service above is serving, repeated here because the backend cannot ask
      # it. It is not a request for a context — it is what the backend measures its own prompt
      # against, so that a record too big for the model is refused rather than half-read. The
      # two default together and have to be raised together. See D34.
      - LLM_NUM_CTX=${OLLAMA_CONTEXT_LENGTH:-16384}
      # One answer means processing the whole record as prompt, before the first token comes
      # back. Measured on the laptop stack: about 17 tokens a second, so a record at the
      # LLM_NUM_CTX default above takes roughly a quarter of an hour. The two defaults are set
      # to agree — whatever the size guard admits, this allows time to finish, or the guard
      # would pass a record only for the timeout to kill it. A GPU answers in seconds and never
      # comes near this. The frontend waits a little longer than the backend, so what a caller
      # sees is the backend's own 504 rather than a severed connection. See D34.
      - LLM_TIMEOUT=${LLM_TIMEOUT:-1800}
      # Which derived file the answering path reads: "reconciled" (the default, with a status
      # on each statement) or "statements" (the flat list, no currency information). Both are
      # on the volume. See D31.
      - ANSWER_SOURCE=${ANSWER_SOURCE:-reconciled}
      - STATEMENTS_FILE_PATH=/data/statements.json
      - RECONCILED_FILE_PATH=/data/reconciled.json
    # Deliberately not published — the backend is reachable from the compose network only.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      # The extraction dependency is implied through the backend, but stating it here keeps
      # the rule readable without tracing it.
      statement-extraction:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    # Reached through Coolify's proxy, not through a host port — the FQDN variable below
    # is what tells the proxy this service on this port gets the domain. See D22.
    expose:
      - "8501"
    environment:
      - SERVICE_FQDN_FRONTEND_8501
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-1860}
    restart: unless-stopped

volumes:
  # The derived artifacts: statements.json and reconciled.json, both written once by the
  # extraction job and both kept here. The backend reads one of them, chosen by ANSWER_SOURCE
  # (reconciled by default). Deletion has to redact both (D31).
  statements:
  # Laptop model store. The VM sets OLLAMA_DATA_DIR and binds its own directory instead,
  # leaving this one unused.
  ollama-models:
